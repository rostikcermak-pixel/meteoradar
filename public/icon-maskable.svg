<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MeteoRadar">
  <!--
    Maskable variant: full-bleed background, artwork scaled into the safe zone
    (the centred circle of 80% diameter) so Android can crop this to a circle,
    squircle, or rounded square without clipping the radar.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a2e"/>
      <stop offset="0.55" stop-color="#080e1a"/>
      <stop offset="1" stop-color="#04060d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#4f46e5" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cellGreen">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cellWarm">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#f97316" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="368.1" y1="112.6" x2="352.4" y2="410.3">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <g transform="translate(256 256) scale(0.86) translate(-256 -256)">
    <!-- range rings + crosshair -->
    <path d="M74 256H438M256 74V438" stroke="#7dd3fc" stroke-opacity="0.09" stroke-width="2"/>
    <circle cx="256" cy="256" r="60" fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="2.5"/>
    <circle cx="256" cy="256" r="121" fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="2.5"/>
    <circle cx="256" cy="256" r="182" fill="none" stroke="#38bdf8" stroke-opacity="0.30" stroke-width="3"/>

    <!-- precipitation returns -->
    <ellipse cx="168" cy="196" rx="62" ry="50" fill="url(#cellGreen)"/>
    <ellipse cx="180" cy="206" rx="27" ry="22" fill="url(#cellWarm)"/>
    <ellipse cx="302" cy="332" rx="46" ry="38" fill="url(#cellGreen)" opacity="0.85"/>
    <ellipse cx="298" cy="336" rx="16" ry="13" fill="url(#cellWarm)" opacity="0.85"/>

    <!-- sweep + leading edge -->
    <path d="M256 256L368.1 112.6A182 182 0 0 1 352.4 410.3Z" fill="url(#sweep)"/>
    <path d="M256 256L368.1 112.6" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="16" stroke-linecap="round"/>
    <path d="M256 256L368.1 112.6" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/>

    <!-- station -->
    <circle cx="256" cy="256" r="18" fill="none" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="256" cy="256" r="9.5" fill="#e0f2fe"/>
  </g>
</svg>
